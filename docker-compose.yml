# Local development stack: the WildFly app + its PostgreSQL database.
# `version` is intentionally omitted — modern `docker compose` ignores it.
services:
  mapseries:
    build: .
    image: mapseries:dev
    # Legacy oracle — only on demand: `docker compose --profile legacy up -d mapseries`
    profiles: ["legacy"]
    restart: "no"
    depends_on:
      - postgres
    environment:
      # Needed only for GitHub login / saving / triggering the harvest.
      # Left empty for now — the app still starts and read-only viewing works.
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      # Local testing: cap the harvest to N records (unset/empty = no limit).
      MAPSERIES_HARVEST_LIMIT: ${MAPSERIES_HARVEST_LIMIT:-}
      # Data source split: READ from the public production repo, WRITE to our fork
      # so editing/admin saves never touch the library's production data.
      MAPSERIES_REPO_USER: ${MAPSERIES_REPO_USER:-moravianlibrary}
      MAPSERIES_REPO_WRITE_USER: ${MAPSERIES_REPO_WRITE_USER:-trineracz}
    ports:
      - "8081:8080"   # OLD WildFly app, now parked on :8081 as a comparison oracle

  # New Spring Boot backend — now the PRIMARY app on :8080 (so the GitHub OAuth
  # callback registered for :8080 works). Serves everything the old app did.
  index-boot:
    build:
      # Repo root as context so catalog/ and edit/ are compiled from source.
      context: .
      dockerfile: index-boot/Dockerfile
    restart: always
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/mapseries
      SPRING_DATASOURCE_USERNAME: mapseries
      SPRING_DATASOURCE_PASSWORD: mapseries
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      MAPSERIES_HARVEST_LIMIT: ${MAPSERIES_HARVEST_LIMIT:-0}
      # Data source (see .env for the read/write split explanation).
      MAPSERIES_REPO_USER: ${MAPSERIES_REPO_USER:-moravianlibrary}
      MAPSERIES_REPO_NAME: ${MAPSERIES_REPO_NAME:-mapseries-data}
      MAPSERIES_REPO_WRITE_USER: ${MAPSERIES_REPO_WRITE_USER:-trineracz}
      MAPSERIES_REPO_WRITE_NAME: ${MAPSERIES_REPO_WRITE_NAME:-mapseries-data}
      # true = editor skips the actual GitHub commit (local click-through / demo).
      MAPSERIES_EDITOR_DRY_RUN: ${MAPSERIES_EDITOR_DRY_RUN:-false}
      # National authority file import (see application.yml mapseries.authorities).
      MAPSERIES_AUTHORITY_DUMP_URL: ${MAPSERIES_AUTHORITY_DUMP_URL:-https://aleph.nkp.cz/data/aut.xml.gz}
      MAPSERIES_AUTHORITY_IMPORT_LIMIT: ${MAPSERIES_AUTHORITY_IMPORT_LIMIT:-0}
      MAPSERIES_AUTHORITY_IMPORT_IF_EMPTY: ${MAPSERIES_AUTHORITY_IMPORT_IF_EMPTY:-false}
      MAPSERIES_AUTHORITY_CRON: ${MAPSERIES_AUTHORITY_CRON:--}
    ports:
      - "8080:8080"   # the new app is now primary on :8080

  postgres:
    image: postgres:10
    restart: always
    # These three auto-create exactly the user/database the app's datasource
    # expects (see configs/standalone-full-mapseries.xml: user=mapseries,
    # password=mapseries, db=mapseries on host "postgres").
    environment:
      POSTGRES_USER: mapseries
      POSTGRES_PASSWORD: mapseries
      POSTGRES_DB: mapseries
    volumes:
      - mapseries-pgdata:/var/lib/postgresql/data

volumes:
  mapseries-pgdata:
