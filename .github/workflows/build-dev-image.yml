name: Build dev image

# Builds the index-boot image (with the catalog and edit frontends) and pushes
# it to GHCR as ghcr.io/<owner>/mapseries:dev, then triggers the infra-backend
# repo to redeploy mapseries.trinera.dev via repository_dispatch.

on:
  push:
    branches: [spring-boot-migration]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/mapseries

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=dev
            type=sha,prefix=dev-

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: index-boot/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build
    if: github.ref == 'refs/heads/spring-boot-migration'
    runs-on: ubuntu-latest
    steps:
      - name: Trigger infra-backend deploy
        env:
          TOKEN: ${{ secrets.INFRA_REPO_DISPATCH_TOKEN }}
          INFRA_REPO: trineracz/infra-backend
        run: |
          if [ -z "$TOKEN" ]; then
            echo "INFRA_REPO_DISPATCH_TOKEN not set — skipping auto-deploy."
            echo "Deploy manually from the infra repo once the token is configured."
            exit 0
          fi
          curl -fsS -X POST \
            -H "Authorization: Bearer $TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${INFRA_REPO}/dispatches" \
            -d '{"event_type":"deploy-mapseries-dev","client_payload":{"image_tag":"dev"}}'
          echo "Dispatched deploy-mapseries-dev to ${INFRA_REPO}."
