<!DOCTYPE html>
<html th:fragment="page(content)" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{admin/fragments :: adminHead}"></head>
<body>

<th:block th:replace="~{fragments :: jsvars}"></th:block>

<div th:if="${admin}" th:replace="~{admin/fragments :: leftPanel}"></div>

<div class="page" th:classappend="${admin} ? '' : 'full'">
    <div th:replace="~{admin/fragments :: topPanel}"></div>
    <div class="main">
        <table th:if="${!authenticated}" class="expand">
            <tr class="text-center">
                <td><a class="btn btn-success noexpand" th:href="${authUrl}" th:text="#{login}"></a></td>
            </tr>
        </table>
        <table th:if="${authenticated and !admin}" class="expand">
            <tr class="text-center">
                <td><p class="text-danger noexpand" th:text="#{notAuthorized}"></p></td>
            </tr>
        </table>
        <div th:if="${admin}">
            <th:block th:replace="${content}"></th:block>
        </div>
    </div>
</div>

<script>window.admin.main()</script>

</body>
</html>
